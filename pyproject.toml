[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "daily-brief-agent"
version = "0.1.0"
description = "Production-oriented Daily Brief Agent scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Codex" }
]
dependencies = [
  "apscheduler>=3.10.4,<4",
  "fastapi>=0.111.0,<1",
  "google-api-python-client>=2.151.0,<3",
  "google-auth-httplib2>=0.2.0,<1",
  "google-auth-oauthlib>=1.2.1,<2",
  "httpx>=0.27.0,<1",
  "jinja2>=3.1.4,<4",
  "langgraph>=0.2.56,<1",
  "pydantic>=2.7.0,<3",
  "pydantic-settings>=2.2.1,<3",
  "python-dotenv>=1.0.1,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0.29,<3",
  "tenacity>=8.2.3,<9",
  "typer>=0.12.3,<1",
  "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0,<2",
  "pytest>=8.2.0,<9",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.4.4,<1",
]

[project.scripts]
daily-brief = "daily_brief.cli:app"
daily-brief-scheduler = "daily_brief.scheduler_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
  "apscheduler.*",
  "google.*",
  "google_auth_oauthlib.*",
  "googleapiclient.*",
  "langgraph.*",
]
ignore_missing_imports = true
